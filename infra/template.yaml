AWSTemplateFormatVersion: "2010-09-09"
Description: Site de l'appartement Las Palmas a Coxyde (S3 prive + CloudFront + page admin protegee)

Parameters:
  AdminPassword:
    Type: String
    NoEcho: true
    MinLength: 4
    Description: Mot de passe de la page /admin
  DomainName:
    Type: String
    Default: ""
    Description: "(Optionnel) Nom de domaine, ex. www.coxyde-laspalmas.be"
  CertificateArn:
    Type: String
    Default: ""
    Description: "(Optionnel) Certificat ACM en us-east-1 couvrant DomainName"
  HostedZoneId:
    Type: String
    Default: ""
    Description: "(Optionnel) Zone Route 53 pour creer l'enregistrement DNS"

Conditions:
  HasDomain: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref CertificateArn, ""]]
  HasDns: !And
    - !Condition HasDomain
    - !Not [!Equals [!Ref HostedZoneId, ""]]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Protege /admin par mot de passe (cookie pose par /connexion/) et sert index.html pour les dossiers.
  RouterFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-router"
      AutoPublish: true
      FunctionConfig:
        Comment: Mot de passe sur /admin + index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        var MOT_DE_PASSE = "${AdminPassword}";
        function handler(event) {
          var req = event.request;
          var uri = req.uri;
          if (uri === "/admin" || uri.indexOf("/admin/") === 0) {
            var c = req.cookies["coxyde_admin"];
            var ok = false;
            if (c) { try { ok = decodeURIComponent(c.value) === MOT_DE_PASSE; } catch (e) {} }
            if (!ok) {
              return {
                statusCode: 302,
                statusDescription: "Found",
                headers: {
                  location: { value: c ? "/connexion/?erreur=1" : "/connexion/" },
                  "cache-control": { value: "no-store" }
                }
              };
            }
          }
          if (uri === "/admin") {
            return { statusCode: 301, statusDescription: "Moved", headers: { location: { value: "/admin/" } } };
          }
          if (uri.endsWith("/")) {
            req.uri = uri + "index.html";
          } else if (uri.split("/").pop().indexOf(".") === -1) {
            req.uri = uri + "/index.html";
          }
          return req;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} - appartement Coxyde"
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: s3
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RouterFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFront
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  DnsRecord:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  SiteUrl:
    Value: !If [HasDomain, !Sub "https://${DomainName}", !Sub "https://${Distribution.DomainName}"]
  AdminUrl:
    Value: !If [HasDomain, !Sub "https://${DomainName}/admin/", !Sub "https://${Distribution.DomainName}/admin/"]
